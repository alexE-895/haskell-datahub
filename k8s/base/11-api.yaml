apiVersion: v1
kind: Service
metadata:
  name: datahub-api
  namespace: datahub
  labels:
    app.kubernetes.io/name: datahub-api
    app.kubernetes.io/part-of: haskell-datahub
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: datahub-api

  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datahub-api
  namespace: datahub
  labels:
    app.kubernetes.io/name: datahub-api
    app.kubernetes.io/part-of: haskell-datahub
spec:
  replicas: 2

  revisionHistoryLimit: 3
  minReadySeconds: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: datahub-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: datahub-api
        app.kubernetes.io/part-of: haskell-datahub

    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: haskell-datahub:dev
          imagePullPolicy: Never

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001

            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: datahub-config

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datahub-secrets
                  key: POSTGRES_PASSWORD

            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datahub-secrets
                  key: CLICKHOUSE_PASSWORD

            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: datahub-secrets
                  key: S3_SECRET_KEY

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 1000m
              memory: 512Mi

          volumeMounts:
            - name: datahub-tmp
              mountPath: /tmp

      volumes:
        - name: datahub-tmp
          emptyDir:
            sizeLimit: 128Mi

      terminationGracePeriodSeconds: 30