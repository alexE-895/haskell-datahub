apiVersion: v1
kind: Service
metadata:
  name: clickhouse-headless
  namespace: datahub
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: haskell-datahub
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123

    - name: native
      port: 9000
      targetPort: 9000

---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: datahub
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: haskell-datahub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123

    - name: native
      port: 9000
      targetPort: 9000

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: datahub
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: haskell-datahub
spec:
  serviceName: clickhouse-headless
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse

  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: haskell-datahub

    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.8
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8123

            - name: native
              containerPort: 9000

          env:
            - name: CLICKHOUSE_DB
              valueFrom:
                configMapKeyRef:
                  name: datahub-config
                  key: CLICKHOUSE_DB

            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: datahub-config
                  key: CLICKHOUSE_USER

            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datahub-secrets
                  key: CLICKHOUSE_PASSWORD

            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >
                  clickhouse-client
                  --user "$CLICKHOUSE_USER"
                  --password "$CLICKHOUSE_PASSWORD"
                  --query "SELECT 1"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >
                  clickhouse-client
                  --user "$CLICKHOUSE_USER"
                  --password "$CLICKHOUSE_PASSWORD"
                  --query "SELECT 1"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 1Gi

          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse

  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 3Gi