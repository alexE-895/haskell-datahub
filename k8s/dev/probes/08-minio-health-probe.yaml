apiVersion: v1
kind: Pod
metadata:
  name: minio-health-probe
  namespace: datahub
spec:
  restartPolicy: Never

  containers:
    - name: probe
      image: curlimages/curl:8.16.0
      imagePullPolicy: IfNotPresent

      command:
        - /bin/sh
        - -c

      args:
        - |
          set -eu

          i=1

          while [ "$i" -le 30 ]; do
            echo "MINIO_HEALTH_ATTEMPT=$i"

            if curl \
              --fail \
              --silent \
              --show-error \
              http://minio:9000/minio/health/ready \
              >/dev/null
            then
              echo "KUBERNETES_MINIO_HEALTH_PASS"
              exit 0
            fi

            i=$((i + 1))
            sleep 1
          done

          echo "MINIO_HEALTH_FAILED"
          exit 1