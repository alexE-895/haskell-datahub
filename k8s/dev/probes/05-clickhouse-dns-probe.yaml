apiVersion: v1
kind: Pod
metadata:
  name: clickhouse-dns-probe
  namespace: datahub
spec:
  restartPolicy: Never

  containers:
    - name: probe
      image: clickhouse/clickhouse-server:25.8
      imagePullPolicy: IfNotPresent

      env:
        - name: CLICKHOUSE_USER
          valueFrom:
            configMapKeyRef:
              name: datahub-config
              key: CLICKHOUSE_USER

        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datahub-secrets
              key: CLICKHOUSE_PASSWORD

      command:
        - /bin/sh
        - -c

      args:
        - |
          set -eu

          i=1

          while [ "$i" -le 30 ]; do
            echo "DNS_ATTEMPT=$i"

            if getent hosts clickhouse; then
              echo "DNS_RESOLUTION=PASS"

              if clickhouse-client \
                --host clickhouse \
                --port 9000 \
                --user "$CLICKHOUSE_USER" \
                --password "$CLICKHOUSE_PASSWORD" \
                --query "SELECT 'KUBERNETES_CLICKHOUSE_DNS_PASS'"
              then
                exit 0
              fi
            fi

            i=$((i + 1))
            sleep 1
          done

          echo "KUBERNETES_CLICKHOUSE_DNS_FAILED"
          exit 1