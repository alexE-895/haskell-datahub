apiVersion: v1
kind: Pod
metadata:
  name: minio-client-probe
  namespace: datahub
spec:
  restartPolicy: Never

  containers:
    - name: mc
      image: minio/mc:latest
      imagePullPolicy: IfNotPresent

      command:
        - /bin/sh
        - -c

      args:
        - |
          echo "MINIO_CLIENT_READY"
          sleep 3600

      env:
        - name: MINIO_ROOT_USER
          valueFrom:
            configMapKeyRef:
              name: datahub-config
              key: MINIO_ROOT_USER

        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datahub-secrets
              key: MINIO_ROOT_PASSWORD