apiVersion: v1
kind: Pod
metadata:
  name: clickhouse-http-probe
  namespace: datahub
spec:
  restartPolicy: Never

  containers:
    - name: probe
      image: curlimages/curl:8.16.0
      imagePullPolicy: IfNotPresent

      env:
        - name: CLICKHOUSE_USER
          valueFrom:
            configMapKeyRef:
              name: datahub-config
              key: CLICKHOUSE_USER

        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datahub-secrets
              key: CLICKHOUSE_PASSWORD

      command:
        - /bin/sh
        - -c

      args:
        - |
          set -eu

          i=1

          while [ "$i" -le 30 ]; do
            echo "HTTP_ATTEMPT=$i"

            if curl \
              --fail \
              --silent \
              --show-error \
              --user "${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}" \
              --data-binary "SELECT 'KUBERNETES_CLICKHOUSE_HTTP_PASS'" \
              http://clickhouse:8123/
            then
              echo
              echo "HTTP_CONNECTION=PASS"
              exit 0
            fi

            i=$((i + 1))
            sleep 1
          done

          echo "KUBERNETES_CLICKHOUSE_HTTP_FAILED"
          exit 1