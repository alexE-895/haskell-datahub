services:

  minio:

    image: minio/minio:RELEASE.2025-09-07T16-13-09Z

    container_name: ${MINIO_CONTAINER_NAME:-haskell-datahub-minio-1}

    command:
      - server
      - /data
      - --console-address
      - :9001

    ports:
      - "${MINIO_API_PUBLISH_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PUBLISH_PORT:-9101}:9001"

    environment:

      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-datahub}

      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-datahub_minio_dev_password}

    volumes:

      - minio_data:/data

    healthcheck:

      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]

      interval: 5s
      timeout: 3s
      retries: 20

    restart: unless-stopped


volumes:

  minio_data: